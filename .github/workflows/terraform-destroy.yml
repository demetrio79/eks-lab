name: "Terraform Destroy — Destruir Infraestrutura"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destruir" para confirmar a destruição de TODOS os recursos'
        required: true
        default: ""
      reason:
        description: "Motivo da destruição (para log de auditoria)"
        required: true
        default: "fim do lab"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.16.4"
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/eks-lab-github-actions"

jobs:
  terraform-destroy:
    name: "Destroy"
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: .

    steps:
      - name: Verificar confirmação
        if: github.event.inputs.confirm != 'destruir'
        run: |
          echo "❌ Confirmação inválida. Digite exatamente 'destruir' no campo confirm."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # OIDC: sem chaves estáticas — token temporário por execução
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-destroy-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan Destroy (preview)
        run: |
          echo "⚠️  RECURSOS QUE SERÃO DESTRUÍDOS:"
          terraform plan -destroy -no-color
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Log de auditoria
        run: |
          echo "🔴 DESTROY iniciado por: ${{ github.actor }}"
          echo "📅 Data/hora: $(date -u)"
          echo "📝 Motivo: ${{ github.event.inputs.reason }}"
          echo "🔗 Run ID: ${{ github.run_id }}"
          echo "🔐 Autenticação: OIDC (sem chaves estáticas)"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Confirmação de destruição
        run: |
          echo "✅ Infraestrutura destruída com sucesso."
          echo "💡 Para recriar: abra um PR com suas alterações e faça o merge na main."
