name: "Terraform Apply — Criar Infraestrutura"

on:
  # Roda o PLAN quando um PR é aberto/atualizado — só revisão, sem apply
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform-apply.yml"

  # Roda o APPLY após o merge na main
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform-apply.yml"

  # Permite rodar manualmente pela UI do GitHub (apply direto na main)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write  # Necessário para comentar o plan no PR

env:
  TF_VERSION: "1.16.4"
  AWS_REGION: "us-east-1"

jobs:
  # ============================================================
  # JOB 1: Plan — roda em todo PR para revisão antes do merge
  # ============================================================
  plan:
    name: "Terraform Plan (PR Review)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
        continue-on-error: true

      # Publica o resultado do plan como comentário no PR
      - name: Comentar plan no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncado)'
              : plan;

            const fmtIcon   = '${{ steps.fmt.outcome }}'      === 'success' ? '✅' : '⚠️';
            const initIcon  = '${{ steps.init.outcome }}'     === 'success' ? '✅' : '❌';
            const valIcon   = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const planIcon  = '${{ steps.plan.outcome }}'     === 'success' ? '✅' : '❌';

            const body = `## 📋 Terraform Plan

            | Step | Status |
            |------|--------|
            | Format  | ${fmtIcon} \`${{ steps.fmt.outcome }}\` |
            | Init    | ${initIcon} \`${{ steps.init.outcome }}\` |
            | Validate| ${valIcon} \`${{ steps.validate.outcome }}\` |
            | Plan    | ${planIcon} \`${{ steps.plan.outcome }}\` |

            <details><summary>📄 Ver plano completo</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            > ⚠️ O \`terraform apply\` só será executado **após o merge na branch main**.
            > *Disparado por @${{ github.actor }} — Run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            // Remove comentários antigos do bot para não poluir o PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.type === 'Bot' && c.body.includes('Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Falhar se o plan falhou
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ============================================================
  # JOB 2: Apply — roda somente após merge na main
  # ============================================================
  apply:
    name: "Terraform Apply (após merge)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production  # Exige aprovação manual configurada no GitHub

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Outputs
        run: terraform output
