name: "Terraform Apply — Criar Infraestrutura"

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform-apply.yml"

  push:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform-apply.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.16.4"
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::688066489200:role/eks-lab-github-actions"

jobs:
  # ============================================================
  # JOB 1: Plan — roda em todo PR para revisão antes do merge
  # ============================================================
  plan:
    name: "Terraform Plan (PR Review)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug JWT sub claim
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo $TOKEN | cut -d. -f2)
          PAYLOAD="${PAYLOAD}==="
          echo "=== SUB claim ==="
          echo $PAYLOAD | python3 -c "
          import sys, base64, json
          p = sys.stdin.read().strip()
          p += '=' * (4 - len(p) % 4)
          d = json.loads(base64.b64decode(p))
          print('sub:', d.get('sub'))
          print('aud:', d.get('aud'))
          print('iss:', d.get('iss'))
          "

      - name: Autenticar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-plan-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Comentar plan no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncado)'
              : plan;

            const fmtIcon  = '${{ steps.fmt.outcome }}'      === 'success' ? '✅' : '⚠️';
            const initIcon = '${{ steps.init.outcome }}'     === 'success' ? '✅' : '❌';
            const valIcon  = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const planIcon = '${{ steps.plan.outcome }}'     === 'success' ? '✅' : '❌';

            const body = `## 📋 Terraform Plan

            | Step | Status |
            |------|--------|
            | Format   | ${fmtIcon} \`${{ steps.fmt.outcome }}\` |
            | Init     | ${initIcon} \`${{ steps.init.outcome }}\` |
            | Validate | ${valIcon} \`${{ steps.validate.outcome }}\` |
            | Plan     | ${planIcon} \`${{ steps.plan.outcome }}\` |

            <details><summary>📄 Ver plano completo</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            > ⚠️ O \`terraform apply\` só será executado **após o merge na branch main**.
            > 🔐 Autenticação via **OIDC** — sem chaves estáticas.
            > *Disparado por @${{ github.actor }} — Run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.type === 'Bot' && c.body.includes('Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Falhar se o plan falhou
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ============================================================
  # JOB 2: Apply — roda somente após merge na main
  # ============================================================
  apply:
    name: "Terraform Apply (após merge)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-apply-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Outputs
        run: terraform output
